
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: backend-law
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Leader-19/backend_law_project.git
    targetRevision: master
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
