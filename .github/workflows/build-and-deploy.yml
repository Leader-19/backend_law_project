name: build-and-deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - 'k8s/**'        # prevents a loop when the workflow commits the new tag
  workflow_dispatch:

permissions:
  contents: write       # to commit the updated manifest
  packages: write       # to push to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: ghcr.io/.*|image: ${IMAGE}:${GITHUB_SHA}|" k8s/deployment.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "deploy: ${GITHUB_SHA::7} [skip ci]" || echo "no changes"
          git push origin master
