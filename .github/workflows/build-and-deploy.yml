
name: Build and Deploy Backend

on:
  push:
    branches:
      - master
    paths-ignore:
      - "k8s/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: backend-law-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: leader-19/backend_law_project

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build and push image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/leader-19/backend_law_project:${{ github.sha }}
            ghcr.io/leader-19/backend_law_project:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Update Kubernetes manifest
      # Change this path if your deployment YAML
      # has a different filename.
      - name: Update Kubernetes Image
        run: |
          sed -i -E \
            's#(image: ghcr.io/leader-19/backend_law_project:).*#\1${{ github.sha }}#' \
            k8s/deployment.yaml

      # 6. Commit updated manifest for Argo CD
      - name: Commit Kubernetes Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "deploy: update backend image to ${{ github.sha }}"
            git push
          fi
