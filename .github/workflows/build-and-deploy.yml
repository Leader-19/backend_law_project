
name: Build and Deploy Backend

on:
  push:
    branches:
      - master
    paths-ignore:
      - "k8s/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: backend-law-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/leader-19/backend_law_project

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build and Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Update Kubernetes manifest
      - name: Update Kubernetes Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          test -f k8s/deployment.yaml

          sed -i -E \
            "s#(image: *${IMAGE_NAME}:).*#\1${IMAGE_TAG}#" \
            k8s/deployment.yaml

          echo "Updated Kubernetes image:"
          grep -n "image:" k8s/deployment.yaml

      # 6. Commit manifest
      - name: Commit Kubernetes Manifest
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "deploy: update backend image to ${{ github.sha }}"
            git push origin HEAD:master
          else
            echo "No Kubernetes manifest changes."
          fi
