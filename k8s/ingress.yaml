
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-law
  namespace: production

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - admin.spritup.site
      secretName: admin-spritup-tls

  rules:
    - host: admin.spritup.site

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: backend-law
                port:
                  number: 80
