apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: laravel-backend
  namespace: backend-law
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - admin.spritup.site
      secretName: admin-spritup-tls
  rules:
    - host: admin.spritup.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: laravel-backend-service
                port:
                  number: 80
