apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-law
  namespace: production
spec:
  replicas: 1                      # keep 1 until uploads use shared storage
  selector:
    matchLabels:
      app: backend-law
  template:
    metadata:
      labels:
        app: backend-law
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend-law
          image: ghcr.io/leader-19/backend_law_project:latest
          ports:
            - containerPort: 80    # CHANGE to the port your Dockerfile serves
          envFrom:
            - secretRef:
                name: backend-law-env
          readinessProbe:
            tcpSocket:
              port: 80             # same port as above
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-law
  namespace: production
spec:
  selector:
    app: backend-law
  ports:
    - port: 80
      targetPort: 80               # same port as above
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-law
  namespace: production
spec:
  rules:
    - host: api.spritup.site       # CHANGE to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-law
                port:
                  number: 80
