apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-backend
  namespace: backend-law
  labels:
    app: laravel-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: laravel-backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: laravel-backend

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: laravel-backend
          image: ghcr.io/leader-19/backend_law_project:6dd0080cf6815ce7670a71b840bd65b2d80ee035
          imagePullPolicy: Always

          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP

          envFrom:
            - secretRef:
                name: laravel-secrets

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
