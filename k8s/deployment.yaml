
apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-law
  namespace: production

spec:
  replicas: 1

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: backend-law

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: backend-law

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: backend-law

          image: ghcr.io/leader-19/backend_law_project:d2752dfb28c2e420601e5e8dd375eb040df391bd

          imagePullPolicy: IfNotPresent

          ports:
            - name: fastcgi
              containerPort: 9000
              protocol: TCP

          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 1000m
              memory: 512Mi

      terminationGracePeriodSeconds: 30
