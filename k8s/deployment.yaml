
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-backend
  namespace: backend-law
  labels:
    app: laravel-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: laravel-backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: laravel-backend

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: laravel-backend

          image: ghcr.io/leader-19/backend_law_project:d7bd9de8ae1eb186bd38a61597af8ed78f9ce301

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: APP_ENV
              value: production

            - name: APP_DEBUG
              value: "false"

            - name: APP_URL
              value: "https://YOUR_DOMAIN"

            - name: LOG_CHANNEL
              value: stderr

            - name: DB_CONNECTION
              value: mysql

            - name: DB_HOST
              value: YOUR_DATABASE_HOST

            - name: DB_PORT
              value: "3306"

            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: laravel-secrets
                  key: DB_DATABASE

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: laravel-secrets
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laravel-secrets
                  key: DB_PASSWORD

            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: laravel-secrets
                  key: APP_KEY

          resources:
            requests:
              cpu: 250m
              memory: 256Mi

            limits:
              cpu: 1000m
              memory: 1Gi

          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
