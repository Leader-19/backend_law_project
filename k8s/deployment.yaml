
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-law
  namespace: production
  labels:
    app: backend-law
spec:
  replicas: 1

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: backend-law

  template:
    metadata:
      labels:
        app: backend-law

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      terminationGracePeriodSeconds: 60

      containers:

        # =================================
        # NGINX CONTAINER
        # =================================
        - name: nginx

          image: ghcr.io/leader-19/backend_law_nginx:latest

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi

        # =================================
        # LARAVEL PHP-FPM CONTAINER
        # =================================
        - name: backend-law

          image: ghcr.io/leader-19/backend_law_project:latest

          imagePullPolicy: Always

          ports:
            - name: fastcgi
              containerPort: 9000
              protocol: TCP

          envFrom:
            - secretRef:
                name: backend-law-env

          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            items:
              - key: default.conf
                path: default.conf

