apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-law
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-law
  template:
    metadata:
      labels:
        app: backend-law
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend-law
          image: ghcr.io/leader-19/backend_law_project:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80          # match your Dockerfile
          envFrom:
            - secretRef:
                name: backend-law-env    # created with kubectl, not in Git
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-law
  namespace: production
spec:
  selector:
    app: backend-law
  ports:
    - port: 80
      targetPort: 80                     # same as containerPort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-law
  namespace: production
spec:
  rules:
    - host: api.spritup.site            # change to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-law
                port:
                  number: 80
